<script>
window.CTX = document.getElementById('c').getContext('2d');
window.READY = (async () => {
  const fams = ['400 40px Kai', '400 40px Zhuan', '700 40px Song', '700 40px Cinzel', '900 40px Cinzel', '600 40px Cormorant', '700 40px Cormorant'];
  await Promise.all(fams.map((f) => document.fonts.load(f, '學学AÉ')));
  await document.fonts.ready;
  return true;
})();
// lecture en temps réel si ouvert dans un navigateur (?play)
if (location.search.includes('play')) {
  window.READY.then(() => { const t0 = performance.now(); const loop = () => { renderFrame((performance.now() - t0) / 1000); requestAnimationFrame(loop); }; loop(); });
}
